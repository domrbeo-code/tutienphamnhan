<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bí Cảnh - Tu Tiên Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #111;
    color: #c8c8c8;
    font-family: 'Courier New', monospace;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px;
  }

  #gameCanvas {
    border: 2px solid #333;
    background: #111;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    box-shadow: 0 0 20px rgba(232,194,122,0.15);
    width: 100%;
    height: auto;
    max-width: 800px;
    aspect-ratio: 2 / 1;
    display: block;
  }

  #status {
    margin-top: 8px;
    font-size: 13px;
    color: #888;
    text-align: center;
    min-height: 20px;
    width: 100%;
    overflow: hidden;
  }

  #status .player-name {
    color: #e8c27a;
    font-weight: bold;
  }

  #status .stat-line {
    color: #6a9a8a;
    margin-top: 2px;
  }

  #btnLeave {
    margin-top: 10px;
    padding: 8px 24px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    background: #2a1a1a;
    color: #e8c27a;
    border: 1px solid #5a3a2a;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  #btnLeave:hover {
    background: #3a2a2a;
    border-color: #8a5a3a;
  }

  #btnLeave:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #loadingOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: #555;
    font-size: 18px;
    text-align: center;
    padding: 20px;
  }

  #loadingOverlay.hidden {
    display: none;
  }

  .controls-hint {
    margin-top: 6px;
    font-size: 11px;
    color: #444;
    text-align: center;
  }

  /* ===== VIRTUAL D-PAD (mobile only) ===== */
  #dpad {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    z-index: 50;
    pointer-events: none;
  }

  .dpad-cluster {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto;
    pointer-events: none;
  }

  .dpad-btn {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(42,42,58,0.75);
    border: 2px solid rgba(138,138,170,0.5);
    color: #c8c8d8;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    touch-action: none;
    transition: background 0.1s, transform 0.05s;
    -webkit-tap-highlight-color: transparent;
  }

  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(90,90,138,0.85);
    transform: scale(0.92);
  }

  .dpad-up    { top: 0;   left: 53px; }
  .dpad-down  { bottom: 0; left: 53px; }
  .dpad-left  { top: 53px; left: 0; }
  .dpad-right { top: 53px; right: 0; }

  #btnLeaveMobile {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 50;
    padding: 10px 18px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    background: rgba(42,26,26,0.85);
    color: #e8c27a;
    border: 1px solid #5a3a2a;
    cursor: pointer;
    border-radius: 4px;
  }

  @media (hover: none) and (pointer: coarse) {
    #dpad { display: block; }
    #btnLeaveMobile { display: block; }
    #btnLeave { display: none; }
    #gameCanvas { max-height: 50vh; }
    .controls-hint { display: none; }
  }

  @media (max-width: 500px) {
    #status { font-size: 11px; }
    #btnLeaveMobile { padding: 8px 14px; font-size: 12px; bottom: 16px; right: 12px; }
    .dpad-cluster { width: 140px; height: 140px; }
    .dpad-btn { width: 46px; height: 46px; font-size: 18px; }
    .dpad-up   { top: 0;   left: 47px; }
    .dpad-down { bottom: 0; left: 47px; }
    .dpad-left { top: 47px; left: 0; }
    .dpad-right{ top: 47px; right: 0; }
  }
</style>
</head>
<body>

<div id="loadingOverlay">Đang kết nối Vân Đài Ký Sự...</div>

<div id="gameWrap">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <p id="status"></p>
  <div class="controls-hint">Di chuyển: A / D hoặc ← / → · Nhảy: W hoặc ↑</div>
  <button id="btnLeave">Rời Bí Cảnh</button>
</div>

<div id="dpad">
  <div class="dpad-cluster">
    <div class="dpad-btn dpad-up"    data-key="w">&#9650;</div>
    <div class="dpad-btn dpad-left"  data-key="a">&#9664;</div>
    <div class="dpad-btn dpad-right" data-key="d">&#9654;</div>
    <div class="dpad-btn dpad-down"  data-key="s">&#9660;</div>
  </div>
</div>

<button id="btnLeaveMobile">Rời Bí Cảnh</button>

<script type="module">
(function(){
  'use strict';

  /* ================= JSONBin CONFIG ================= */
  const JSONBIN_API_KEY = "$2a$10$I0dCIJa0Pmh.y8pZkIFYkOgQz4E5yBcv7gNR19WOBs1u2s7.oxRkO";
  const JSONBIN_BIN_ID = "6a89525fda38895dfe02bb7f";
  const JSONBIN_BASE = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;

  /* ================= GAME STATE ================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const btnLeave = document.getElementById('btnLeave');
  const btnLeaveMobile = document.getElementById('btnLeaveMobile');
  const loadingOverlay = document.getElementById('loadingOverlay');

  let myPlayerId = null;
  let myPlayerName = 'Vô Danh';
  let allBinData = null;

  const player = {
    x: 100,
    y: 280,
    speed: 3,
    facingLeft: false,
    isMoving: false
  };

  const keys = {};

  /* ================= MULTIPLAYER STATE ================= */
  let otherPlayers = {};
  const SYNC_INTERVAL = 1500;
  const STALE_TIMEOUT = 10000;
  let syncInProgress = false;
  let lastPositionUpload = 0;
  const POSITION_UPLOAD_THROTTLE = 500;
  let positionDirty = false;

  /* ================= PLAYER ID FROM URL (no random generation) ================= */
  function getPlayerIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var pid = params.get('pid');
    if (pid && pid.length > 3) return pid;
    return null;
  }

  function fetchPlayerName(pid) {
    return fetchWithTimeout(JSONBIN_BASE + '/latest', {
      method: 'GET',
      headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
    }, 8000).then(function(res) {
      if (!res.ok) return 'Vô Danh';
      return res.json().then(function(data) {
        var record = extractRecord(data);
        if (record && record.players && record.players[pid]) {
          return record.players[pid].name || 'Vô Danh';
        }
        return 'Vô Danh';
      });
    }).catch(function() { return 'Vô Danh'; });
  }

  /* ================= ASSET LOADING ================= */
  let idleFrames = [];
  let moveFrames = [];
  let loadedCount = 0;
  const TOTAL_SPRITES = 16;
  let spritesReady = false;

  function onSpriteLoad() {
    loadedCount++;
    if (loadedCount >= TOTAL_SPRITES) spritesReady = true;
  }

  for (let i = 1; i <= 8; i++) {
    let img = new Image();
    img.onload = onSpriteLoad;
    img.onerror = onSpriteLoad;
    img.src = 'ActorA_idle_' + i + '.png';
    idleFrames.push(img);
  }
  for (let i = 1; i <= 8; i++) {
    let img = new Image();
    img.onload = onSpriteLoad;
    img.onerror = onSpriteLoad;
    img.src = 'ActorA_move_' + i + '.png';
    moveFrames.push(img);
  }

  /* ================= ANIMATION STATE MACHINE ================= */
  let currentFrames = idleFrames;
  let frameIndex = 0;
  let frameTimer = 0;
  const frameInterval = 7;

  const SPRITE_SCALE = 2;
  const SPRITE_W = 48 * SPRITE_SCALE;
  const SPRITE_H = 48 * SPRITE_SCALE;

  const GROUND_Y = 280;
  const MAP_WIDTH = 2400;
  const GRAVITY = 0.8;
  const JUMP_FORCE = -14;
  let velocityY = 0;
  let isGrounded = true;

  /* ================= JSONBIN HELPERS ================= */
  function fetchWithTimeout(url, options, timeoutMs) {
    timeoutMs = timeoutMs || 8000;
    return Promise.race([
      fetch(url, options),
      new Promise(function(_, reject) {
        setTimeout(function() { reject(new Error('timeout')); }, timeoutMs);
      })
    ]);
  }

  function extractRecord(data) {
    if (data && typeof data === 'object' && 'record' in data && 'metadata' in data) return data.record;
    return data;
  }

  /* ================= INIT PLAYER ON SERVER ================= */
  async function initPlayerOnServer() {
    myPlayerId = getPlayerIdFromUrl();
    if (!myPlayerId) {
      loadingOverlay.textContent = 'Không tìm thấy Mã Đạo Hữu — đang chuyển về trang đăng nhập...';
      setTimeout(function() { window.location.href = 'index.html'; }, 1500);
      return;
    }
    myPlayerName = await fetchPlayerName(myPlayerId);

    try {
      var res = await fetchWithTimeout(JSONBIN_BASE + '/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
      }, 8000);

      if (!res.ok) throw new Error('HTTP ' + res.status);

      var data = await res.json();
      var record = extractRecord(data);

      if (!record || typeof record !== 'object' || Array.isArray(record)) {
        record = {};
      }

      if (!record.players || typeof record.players !== 'object' || Array.isArray(record.players)) {
        record.players = {};
      }

      var existing = record.players[myPlayerId];
      if (existing && typeof existing.bicanhX === 'number') {
        player.x = existing.bicanhX;
      }
      if (existing && typeof existing.bicanhY === 'number') {
        player.y = existing.bicanhY;
      }

      var now = Date.now();
      record.players[myPlayerId] = {
        bicanhX: Math.round(player.x),
        bicanhY: Math.round(player.y),
        bicanhFacingLeft: player.facingLeft,
        bicanhMoving: false,
        bicanhLastSeen: now,
        name: myPlayerName
      };

      allBinData = record;

      await fetchWithTimeout(JSONBIN_BASE, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
        body: JSON.stringify(record)
      }, 8000);

      loadingOverlay.classList.add('hidden');
      updateStatusDisplay();
    } catch (err) {
      loadingOverlay.textContent = 'Lỗi kết nối: ' + (err && err.message);
    }
  }

  /* ================= THROTTLED POSITION UPLOAD ================= */
  async function uploadMyPosition() {
    if (!myPlayerId || syncInProgress) return;
    syncInProgress = true;
    try {
      var res = await fetchWithTimeout(JSONBIN_BASE + '/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
      }, 8000);
      if (!res.ok) { syncInProgress = false; return; }
      var data = await res.json();
      var record = extractRecord(data);
      if (!record || typeof record !== 'object' || Array.isArray(record)) { syncInProgress = false; return; }
      if (!record.players || typeof record.players !== 'object' || Array.isArray(record.players)) record.players = {};
      record.players[myPlayerId] = {
        bicanhX: Math.round(player.x),
        bicanhY: Math.round(player.y),
        bicanhFacingLeft: player.facingLeft,
        bicanhMoving: player.isMoving,
        bicanhLastSeen: Date.now(),
        name: myPlayerName
      };
      await fetchWithTimeout(JSONBIN_BASE, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
        body: JSON.stringify(record)
      }, 8000);
    } catch (err) { console.error('uploadMyPosition error:', err); }
    syncInProgress = false;
  }

  function maybeUploadPosition() {
    if (!player.isMoving) return;
    var now = Date.now();
    if (now - lastPositionUpload >= POSITION_UPLOAD_THROTTLE) {
      lastPositionUpload = now;
      uploadMyPosition();
    }
  }

  /* ================= MULTIPLAYER SYNC (polling GET) ================= */
  async function syncWithServer() {
    if (!myPlayerId || syncInProgress) return;
    syncInProgress = true;

    try {
      var res = await fetchWithTimeout(JSONBIN_BASE + '/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
      }, 8000);
      if (!res.ok) { syncInProgress = false; return; }

      var data = await res.json();
      var record = extractRecord(data);
      if (!record || typeof record !== 'object' || Array.isArray(record)) { syncInProgress = false; return; }

      if (!record.players || typeof record.players !== 'object' || Array.isArray(record.players)) {
        record.players = {};
      }

      var now = Date.now();

      /* --- Update other players from server data --- */
      var newOthers = {};
      for (var pid in record.players) {
        if (pid === myPlayerId) continue;
        var p = record.players[pid];
        if (!p || typeof p.bicanhX !== 'number' || typeof p.bicanhY !== 'number') continue;
        var lastSeen = p.bicanhLastSeen || 0;
        if (lastSeen > 0 && now - lastSeen > STALE_TIMEOUT) continue;

        var existing = otherPlayers[pid];
        var prevCurrentX = existing ? existing.currentX : p.bicanhX;
        var prevCurrentY = existing ? existing.currentY : p.bicanhY;
        newOthers[pid] = {
          targetX: p.bicanhX,
          targetY: p.bicanhY,
          currentX: prevCurrentX,
          currentY: prevCurrentY,
          facingLeft: !!p.bicanhFacingLeft,
          isMoving: !!p.bicanhMoving,
          name: p.name || 'Vô Danh',
          lastSeen: lastSeen,
          frameIndex: existing ? existing.frameIndex : 0,
          frameTimer: existing ? existing.frameTimer : 0,
          currentFrames: existing ? existing.currentFrames : idleFrames
        };
      }
      otherPlayers = newOthers;
      allBinData = record;
      updateStatusDisplay();
    } catch (err) {
      console.error('syncWithServer error:', err);
    }

    syncInProgress = false;
  }

  /* ================= LEAVE BÍ CẢNH ================= */
  async function leaveBicanh() {
    if (!myPlayerId) return;

    btnLeave.disabled = true;
    btnLeave.textContent = 'Đang lưu...';
    if (btnLeaveMobile) btnLeaveMobile.textContent = 'Đang lưu...';

    try {
      var res = await fetchWithTimeout(JSONBIN_BASE + '/latest', {
        method: 'GET',
        headers: { 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Meta': 'false' }
      }, 8000);

      if (!res.ok) throw new Error('HTTP ' + res.status);

      var data = await res.json();
      var record = extractRecord(data);
      if (!record || typeof record !== 'object' || Array.isArray(record)) record = {};
      if (!record.players || typeof record.players !== 'object') record.players = {};

      record.players[myPlayerId] = record.players[myPlayerId] || {};
      record.players[myPlayerId].bicanhX = Math.round(player.x);
      record.players[myPlayerId].bicanhY = Math.round(player.y);
      record.players[myPlayerId].bicanhLastSeen = 0;
      record.players[myPlayerId].name = myPlayerName;

      await fetchWithTimeout(JSONBIN_BASE, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
        body: JSON.stringify(record),
        keepalive: true
      }, 8000);

      btnLeave.textContent = 'Đã lưu!';
      if (btnLeaveMobile) btnLeaveMobile.textContent = 'Đã lưu!';
    } catch (err) {
      btnLeave.textContent = 'Lỗi lưu!';
      btnLeave.disabled = false;
      if (btnLeaveMobile) btnLeaveMobile.textContent = 'Lỗi lưu!';
      console.error('leaveBicanh error:', err);
      return;
    }

    setTimeout(function() {
      window.location.href = 'index.html';
    }, 300);
  }

  /* ================= STATUS DISPLAY ================= */
  function updateStatusDisplay() {
    var onlineCount = Object.keys(otherPlayers).length + 1;
    statusEl.innerHTML =
      '<span class="player-name">' + myPlayerName + '</span>' +
      '<br><span class="stat-line">ID: ' + (myPlayerId || '').substr(0, 12) + '... · Đạo hữu online: ' + onlineCount + '</span>';
  }

  /* ================= INPUT HANDLING ================= */
  document.addEventListener('keydown', function(e) {
    var key = e.key.toLowerCase();
    keys[key] = true;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
    }
    if ((key === 'w' || e.key === 'ArrowUp') && isGrounded) {
      velocityY = JUMP_FORCE;
      isGrounded = false;
    }
  });

  document.addEventListener('keyup', function(e) {
    keys[e.key.toLowerCase()] = false;
  });

  /* ================= VIRTUAL D-PAD ================= */
  var dpadButtons = document.querySelectorAll('.dpad-btn');
  dpadButtons.forEach(function(btn) {
    var key = btn.getAttribute('data-key');

    function press(e) {
      e.preventDefault();
      btn.classList.add('pressed');
      keys[key] = true;
      if (key === 'w' && isGrounded) {
        velocityY = JUMP_FORCE;
        isGrounded = false;
      }
    }

    function release(e) {
      e.preventDefault();
      btn.classList.remove('pressed');
      keys[key] = false;
    }

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('touchcancel', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  /* ================= GAME LOOP ================= */
  function update() {
    var moving = false;

    if (keys['a'] || keys['arrowleft']) {
      player.x -= player.speed;
      player.facingLeft = true;
      moving = true;
    }
    if (keys['d'] || keys['arrowright']) {
      player.x += player.speed;
      player.facingLeft = false;
      moving = true;
    }

    player.isMoving = moving;

    if (player.x < 0) player.x = 0;
    if (player.x > MAP_WIDTH - SPRITE_W) player.x = MAP_WIDTH - SPRITE_W;

    velocityY += GRAVITY;
    player.y += velocityY;

    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      velocityY = 0;
      isGrounded = true;
    }

    if (moving) {
      if (currentFrames !== moveFrames) { currentFrames = moveFrames; frameIndex = 0; frameTimer = 0; }
    } else {
      if (currentFrames !== idleFrames) { currentFrames = idleFrames; frameIndex = 0; frameTimer = 0; }
    }

    frameTimer++;
    if (frameTimer >= frameInterval) {
      frameTimer = 0;
      frameIndex = (frameIndex + 1) % currentFrames.length;
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var cameraX = player.x - canvas.width / 2 + SPRITE_W / 2;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > MAP_WIDTH - canvas.width) cameraX = MAP_WIDTH - canvas.width;

    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(0, GROUND_Y + SPRITE_H - 20, canvas.width, canvas.height - (GROUND_Y + SPRITE_H - 20));

    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + SPRITE_H - 20);
    ctx.lineTo(canvas.width, GROUND_Y + SPRITE_H - 20);
    ctx.stroke();

    for (var i = 0; i < 40; i++) {
      var starX = (i * 137) % canvas.width;
      var starY = (i * 73) % (GROUND_Y + SPRITE_H - 30);
      var alpha = 0.3 + 0.2 * Math.sin(Date.now() / 1000 + i);
      ctx.fillStyle = 'rgba(200,200,220,' + alpha + ')';
      ctx.fillRect(starX, starY, 1, 1);
    }

    for (var m = 0; m < 5; m++) {
      var mx = ((m * 500 - cameraX * 0.3) % (MAP_WIDTH + 200)) - 100;
      if (mx < -200) mx += MAP_WIDTH + 400;
      ctx.fillStyle = 'rgba(30,30,50,0.6)';
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y + SPRITE_H - 20);
      ctx.lineTo(mx + 80, GROUND_Y + SPRITE_H - 80);
      ctx.lineTo(mx + 160, GROUND_Y + SPRITE_H - 20);
      ctx.closePath();
      ctx.fill();
    }

    for (var t = 0; t < 20; t++) {
      var tx = t * 120 - cameraX;
      if (tx > -50 && tx < canvas.width + 50) {
        ctx.fillStyle = '#1a2a1a';
        ctx.fillRect(tx + 8, GROUND_Y + SPRITE_H - 35, 4, 15);
        ctx.fillStyle = '#2a3a2a';
        ctx.beginPath();
        ctx.arc(tx + 10, GROUND_Y + SPRITE_H - 38, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    return cameraX;
  }

  function drawNameLabel(drawX, drawY, name, color) {
    ctx.textAlign = 'center';
    ctx.font = '11px Courier New';
    var textW = ctx.measureText(name).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(drawX + SPRITE_W / 2 - textW / 2 - 4, drawY - 18, textW + 8, 16);
    ctx.fillStyle = color || '#e8c27a';
    ctx.fillText(name, drawX + SPRITE_W / 2, drawY - 6);
    ctx.textAlign = 'left';
  }

  function drawSprite(frame, drawX, drawY, facingLeft) {
    if (frame && frame.complete && frame.naturalWidth > 0) {
      if (facingLeft) {
        ctx.save();
        ctx.translate(drawX + SPRITE_W, drawY);
        ctx.scale(-1, 1);
        ctx.drawImage(frame, 0, 0, SPRITE_W, SPRITE_H);
        ctx.restore();
      } else {
        ctx.drawImage(frame, drawX, drawY, SPRITE_W, SPRITE_H);
      }
    }
  }

  var LERP_FACTOR = 0.15;

  function updateRemotePlayers() {
    for (var pid in otherPlayers) {
      var p = otherPlayers[pid];
      p.currentX += (p.targetX - p.currentX) * LERP_FACTOR;
      p.currentY += (p.targetY - p.currentY) * LERP_FACTOR;

      var targetFrames = p.isMoving ? moveFrames : idleFrames;
      if (p.currentFrames !== targetFrames) {
        p.currentFrames = targetFrames;
        p.frameIndex = 0;
        p.frameTimer = 0;
      }
      p.frameTimer++;
      if (p.frameTimer >= frameInterval) {
        p.frameTimer = 0;
        p.frameIndex = (p.frameIndex + 1) % p.currentFrames.length;
      }
    }
  }

  function drawOtherPlayers(cameraX) {
    for (var pid in otherPlayers) {
      var p = otherPlayers[pid];

      var drawX = p.currentX - cameraX;
      var drawY = p.currentY;

      if (drawX < -SPRITE_W || drawX > canvas.width) continue;

      drawNameLabel(drawX, drawY, p.name, '#8a9aca');
      var frame = p.currentFrames[p.frameIndex];
      drawSprite(frame, drawX, drawY, p.facingLeft);
    }
  }

  function drawPlayer(cameraX) {
    var drawX = player.x - cameraX;
    var drawY = player.y;
    var frame = currentFrames[frameIndex];

    drawSprite(frame, drawX, drawY, player.facingLeft);
    drawNameLabel(drawX, drawY, myPlayerName, '#e8c27a');
  }

  function drawHUD(cameraX) {
    ctx.fillStyle = 'rgba(200,200,200,0.5)';
    ctx.font = '12px Courier New';
    ctx.fillText('Vị trí: ' + Math.round(player.x) + ', ' + Math.round(player.y), 10, 18);
    ctx.fillText('Đạo hữu online: ' + (Object.keys(otherPlayers).length + 1), 10, 34);
    ctx.fillText('Bí Cảnh - Cửa vào không gian cổ xưa', 10, canvas.height - 10);
  }

  function render() {
    var cameraX = drawBackground();
    drawOtherPlayers(cameraX);
    drawPlayer(cameraX);
    drawHUD(cameraX);
  }

  function gameLoop() {
    update();
    updateRemotePlayers();
    maybeUploadPosition();
    render();
    requestAnimationFrame(gameLoop);
  }

  /* ================= INIT ================= */
  btnLeave.addEventListener('click', function() { leaveBicanh(); });
  if (btnLeaveMobile) {
    btnLeaveMobile.addEventListener('click', function() { leaveBicanh(); });
  }

  function tryStartGame() {
    if (myPlayerId && spritesReady) {
      gameLoop();
      syncWithServer();
      setInterval(syncWithServer, SYNC_INTERVAL);
    } else if (myPlayerId && !spritesReady) {
      setTimeout(tryStartGame, 100);
    }
  }

  window.addEventListener('load', function() {
    initPlayerOnServer().then(tryStartGame);
  });

})();
</script>
</body>
</html>
